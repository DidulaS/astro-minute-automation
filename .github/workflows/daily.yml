
name: Astro Minute Daily Automation

on:
  workflow_dispatch:
  schedule:


permissions:
  contents: read

concurrency:
  group: astro-minute-daily
  cancel-in-progress: false

jobs:
  generate-video:
    name: Generate and Upload Astro Minute Short

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      # =====================================
      # STEP 1 - DOWNLOAD PROJECT
      # =====================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =====================================
      # STEP 2 - SET UP PYTHON
      # =====================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # =====================================
      # STEP 3 - INSTALL VIDEO TOOLS
      # =====================================

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            fonts-dejavu-core \
            libass9

      # =====================================
      # STEP 4 - INSTALL PYTHON PACKAGES
      # =====================================

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            edge-tts \
            pillow \
            google-auth \
            google-api-python-client

      # =====================================
      # STEP 5 - GENERATE CONTENT
      # =====================================

      - name: Generate science script and narration
        run: python main.py

      # =====================================
      # STEP 6 - GENERATE VIDEO
      # =====================================

      - name: Render vertical YouTube Short
        run: python render_video.py

      # =====================================
      # STEP 7 - VALIDATE VIDEO
      # =====================================

      - name: Check generated MP4
        run: |
          test -s output/astro_minute_short.mp4
          test -s output/video_script.json

          ffprobe -v error \
            -show_entries stream=width,height \
            -of default=noprint_wrappers=1 \
            output/astro_minute_short.mp4

      # =====================================
      # STEP 8 - SAVE GENERATED FILES
      # =====================================

      - name: Save video artifacts
        uses: actions/upload-artifact@v4
        with:
          name: astro-minute-video
          path: output/
          if-no-files-found: error
          retention-days: 7

      # =====================================
      # STEP 9 - UPLOAD PUBLIC VIDEO
      # =====================================

      - name: Upload public Short to YouTube
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: python upload_youtube.py

      # =====================================
      # STEP 10 - COMPLETION
      # =====================================

      - name: Automation completed
        run: |
          echo "Astro Minute daily workflow completed."
