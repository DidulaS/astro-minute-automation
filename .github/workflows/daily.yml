
name: Astro Minute Daily Automation

on:
  workflow_dispatch:
    inputs:
      upload_test:
        description: "Upload generated video privately to YouTube?"
        required: true
        type: boolean
        default: false

  schedule:
    # 9:00 AM Sri Lanka time
    - cron: '30 3 * * *'

permissions:
  contents: read

jobs:
  generate-video:
    name: Generate Astro Minute Video
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg fonts-dejavu-core libass9

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            edge-tts \
            pillow \
            google-auth \
            google-api-python-client

      - name: Generate script and narration
        run: python main.py

      - name: Render YouTube Short
        run: python render_video.py

      - name: Check generated MP4
        run: |
          test -s output/astro_minute_short.mp4
          ffprobe -v error \
            -show_entries stream=width,height \
            -of default=noprint_wrappers=1 \
            output/astro_minute_short.mp4

      - name: Save generated video
        uses: actions/upload-artifact@v4
        with:
          name: astro-minute-video
          path: output/
          if-no-files-found: error
          retention-days: 7

      - name: Upload private test to YouTube
        if: >-
          ${{
            github.event_name == 'workflow_dispatch'
            && inputs.upload_test == true
          }}
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: python upload_youtube.py
