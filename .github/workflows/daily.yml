
name: Astro Minute Daily Automation

on:
  workflow_dispatch:

  schedule:
    - cron: '30 3 * * *'

permissions:
  contents: read

jobs:
  generate-video:
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Astro Minute
        run: python main.py
